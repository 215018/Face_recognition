[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition"
version = "0.1.0"
description = "CNN for facial expression recognition using FER-2013"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "mediapipe==0.10.14",
    "opencv-contrib-python==4.10.0.84",
]
[tool.setuptools.packages.find]
where = ["src"]